# IrrigationOS Control Center
#
# Home Assistant installation:
# 1. Settings > Dashboards > Add dashboard.
# 2. Open the new dashboard, choose Edit dashboard, then Raw configuration editor.
# 3. Replace the generated content with this entire file.
#
# This dashboard uses only built-in Home Assistant cards. It requires the
# IrrigationOS v1.0.61 entity contract. Manual watering actions remain explicit,
# finite, observation-driven operator controls; they do not authorize automation.

title: IrrigationOS Control Center
views:
  - title: Control Center
    path: irrigationos
    icon: mdi:sprinkler-variant
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: System Health
        cards:
          - type: heading
            heading: IrrigationOS
            icon: mdi:sprinkler-variant
          - type: tile
            entity: sensor.irrigationos_status
            name: Operating mode
            icon: mdi:shield-eye
          - type: tile
            entity: binary_sensor.irrigationos_cloud_connection
            name: Cloud connection
            icon: mdi:cloud-check
          - type: tile
            entity: binary_sensor.irrigationos_realtime_observation
            name: Realtime observation
            icon: mdi:access-point
          - type: tile
            entity: binary_sensor.irrigationos_polling_fallback
            name: Polling fallback
            icon: mdi:refresh-auto
          - type: tile
            entity: sensor.irrigationos_last_successful_refresh
            name: Last successful refresh
            icon: mdi:clock-check-outline
          - type: tile
            entity: sensor.irrigationos_landscape_profile_status
            name: Landscape profiles
            icon: mdi:land-plots

      - type: grid
        title: Current Activity
        cards:
          - type: heading
            heading: Watering Activity
            icon: mdi:water
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.irrigationos_watering_active
                state: "on"
            card:
              type: tile
              entity: binary_sensor.irrigationos_watering_active
              name: Watering active
              icon: mdi:water
              color: blue

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.irrigationos_watering_active
                state: "off"
            card:
              type: tile
              entity: binary_sensor.irrigationos_watering_active
              name: Watering inactive
              icon: mdi:water-off
              color: disabled

          - type: markdown
            title: Active zone details
            content: >-
              {% set count = state_attr('binary_sensor.irrigationos_watering_active', 'active_zone_count') or 0 %}
              {% set names = state_attr('binary_sensor.irrigationos_watering_active', 'active_zone_names') or [] %}
              {% set slots = state_attr('binary_sensor.irrigationos_watering_active', 'active_zone_slots') or [] %}
              {% set vendors = state_attr('binary_sensor.irrigationos_watering_active', 'active_zone_vendor_names') or [] %}

              {% if is_state('binary_sensor.irrigationos_watering_active', 'on') %}

              **Currently watering:** {{ count }} zone{{ '' if count == 1 else 's' }}

              **Zone:** {{ names | join(', ') if names else 'Name unavailable' }}

              **Slot:** {{ slots | join(', ') if slots else 'Unavailable' }}

              **Vendor:** {{ vendors | join(', ') if vendors else 'Not supplied' }}

              {% else %}

              No zones are currently watering.

              {% endif %}

          - type: entities
            title: Realtime telemetry
            show_header_toggle: false
            entities:
              - entity: binary_sensor.irrigationos_realtime_observation
                name: Registration health
              - type: attribute
                entity: binary_sensor.irrigationos_realtime_observation
                attribute: registered_controllers
                name: Registered controllers
              - type: attribute
                entity: binary_sensor.irrigationos_realtime_observation
                attribute: expected_controllers
                name: Expected controllers
              - type: attribute
                entity: binary_sensor.irrigationos_realtime_observation
                attribute: accepted_event_count
                name: Accepted events
              - type: attribute
                entity: binary_sensor.irrigationos_realtime_observation
                attribute: rejected_event_count
                name: Rejected events
              - type: attribute
                entity: binary_sensor.irrigationos_realtime_observation
                attribute: duplicate_event_count
                name: Duplicate events

      - type: grid
        title: Manual Zone Control
        cards:
          - type: heading
            heading: Manual Zone Control
            icon: mdi:valve
          - type: entities
            title: Operator-directed watering
            show_header_toggle: false
            entities:
              - valve.zone_1_manual_watering
              - number.zone_1_manual_watering_duration
              - valve.zone_2_manual_watering
              - number.zone_2_manual_watering_duration
              - valve.zone_4_manual_watering
              - number.zone_4_manual_watering_duration
              - valve.zone_5_manual_watering
              - number.zone_5_manual_watering_duration
          - type: markdown
            content: >-
              Opening a valve starts only that selected zone for its chosen finite
              duration. Closing a valve uses the controller's safe stop-all-watering
              command. State remains based on observed controller activity.

      - type: grid
        title: Diagnostics
        cards:
          - type: heading
            heading: Diagnostics
            icon: mdi:stethoscope
          - type: entities
            show_header_toggle: false
            entities:
              - sensor.irrigationos_controller_provider
              - sensor.irrigationos_controller_count
              - sensor.irrigationos_area_count
              - sensor.irrigationos_discovery_summary
              - sensor.irrigationos_last_successful_refresh
              - binary_sensor.irrigationos_cloud_connection
              - binary_sensor.irrigationos_realtime_observation
              - binary_sensor.irrigationos_polling_fallback
