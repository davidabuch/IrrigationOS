[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "irrigationos"
version = "1.0.52"
description = "An intelligent irrigation operating system for Home Assistant"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "David Buch"}]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
exclude = [".venv"]
ignore_missing_imports = true
disable_error_code = ["call-arg", "misc", "no-any-return"]
